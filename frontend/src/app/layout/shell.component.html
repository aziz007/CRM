<mat-toolbar color="primary" class="toolbar">
  <span class="brand">Real Estate CRM</span>

  <nav class="nav">
    <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
    <a mat-button routerLink="/leads" routerLinkActive="active">Leads</a>
    <a mat-button routerLink="/calls" routerLinkActive="active">Calls</a>
    <a mat-button routerLink="/tasks" routerLinkActive="active">Tasks</a>
    @if (auth.isAdmin()) {
      <a mat-button routerLink="/admin" routerLinkActive="active">Admin</a>
    }
  </nav>

  <span class="spacer"></span>

  @if (auth.currentUser(); as user) {
    <span class="user">{{ user.name }} ({{ user.role }})</span>
  }
  <button mat-button type="button" (click)="logout()">Sign out</button>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
